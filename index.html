<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二年級數學小測驗</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Quicksand:wght@500;600&display=swap">
<style>
/* Layout: one centered column. Home (ten unit cards) -> quiz (one question at a time) -> result (stars + review). */
:root{
  color-scheme:light;
  --bg:#eaf4ff; --dot:#d6e7fb; --card:#ffffff; --ink:#263f5f; --ink-soft:#5d7392;
  --blue:#5aa5f2; --blue-deep:#2468c4; --blue-soft:#dcecff;
  --yellow:#ffd96b; --yellow-deep:#e0ad00; --yellow-soft:#fff4c9; --on-yellow:#3d3100;
  --pink:#ffc6da; --pink-deep:#d4487f; --pink-soft:#ffe9f1; --on-pink:#4d1833;
  --line:#c6dbf4; --btn:#2f7de1; --on-btn:#ffffff; --btn-edge:#1d5cb0;
  --lift:0 12px 24px -16px rgba(36,104,196,.55);
  --font-body:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --font-num:'Quicksand','Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101f3a; --dot:#193259; --card:#18305a; --ink:#eaf3ff; --ink-soft:#aac0df;
    --blue:#6fb2ff; --blue-deep:#a3cfff; --blue-soft:#25477a;
    --yellow:#ffd96b; --yellow-deep:#ffd96b; --yellow-soft:#52471f;
    --pink:#ff9fc2; --pink-deep:#ff9fc2; --pink-soft:#4f2b46;
    --line:#37598a; --btn:#5aa8ff; --on-btn:#0b2447; --btn-edge:#3a7bc4;
    --lift:0 12px 24px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101f3a; --dot:#193259; --card:#18305a; --ink:#eaf3ff; --ink-soft:#aac0df;
  --blue:#6fb2ff; --blue-deep:#a3cfff; --blue-soft:#25477a;
  --yellow:#ffd96b; --yellow-deep:#ffd96b; --yellow-soft:#52471f;
  --pink:#ff9fc2; --pink-deep:#ff9fc2; --pink-soft:#4f2b46;
  --line:#37598a; --btn:#5aa8ff; --on-btn:#0b2447; --btn-edge:#3a7bc4;
  --lift:0 12px 24px -16px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-weight:400; font-size:17px; line-height:1.7; letter-spacing:.03em;
  background-image:radial-gradient(var(--dot) 1.6px, transparent 1.6px); background-size:30px 30px;
  padding-block:20px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
h1,h2,h3,h4,b,strong,button,th{font-weight:400}
h1,h2,h3,p{margin:0}
button{font:inherit; letter-spacing:inherit; color:inherit}
.wrap{max-width:720px; margin-inline:auto}
.screen{display:grid; gap:20px}
:focus-visible{outline:3px solid var(--yellow-deep); outline-offset:3px}
.num{font-family:var(--font-num); font-weight:500; letter-spacing:.02em}

/* ---------- home ---------- */
.hero{display:grid; gap:12px; justify-items:center; text-align:center; padding:6px 0 2px}
.hero-pig{height:98px}
.pigsvg{display:block; height:100%; width:auto; max-width:100%; overflow:visible}
.eyebrow{font-size:.82rem; color:var(--blue-deep); letter-spacing:.14em}
h1{font-size:clamp(1.7rem,6.4vw,2.2rem); line-height:1.3; text-wrap:balance; margin-top:2px}
.lede{margin-top:6px; color:var(--ink-soft); font-size:.98rem}
.lessons{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:14px}
.lesson{
  display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:center;
  padding:14px 16px; border-radius:24px; border:2px solid; text-align:left; cursor:pointer; box-shadow:var(--lift);
  transition:transform .12s ease;
}
.lesson:hover{transform:translateY(-2px)}
.lesson:active{transform:translateY(1px)}
.lesson .ico{width:60px; height:60px; display:block}
.lesson .no{font-size:.8rem; letter-spacing:.14em}
.lesson .nm{font-size:1.14rem; line-height:1.4; margin-top:1px}
.lesson .sub{font-size:.84rem; color:var(--ink-soft); line-height:1.5; margin-top:3px}
.lesson .best{font-size:.8rem; color:var(--ink-soft); margin-top:5px}
.l1{background:var(--blue-soft); border-color:var(--blue)} .l1 .no{color:var(--blue-deep)}
.l2{background:var(--yellow-soft); border-color:var(--yellow-deep)} .l2 .no{color:var(--ink-soft)}
.l3{background:var(--pink-soft); border-color:var(--pink-deep)} .l3 .no{color:var(--pink-deep)}
.foot{text-align:center; color:var(--ink-soft); font-size:.88rem; line-height:1.8}
.voicebox{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; font-size:.88rem; color:var(--ink-soft)}
.voicebox select{min-height:42px; max-width:100%; padding:0 14px; border-radius:999px; border:2px solid var(--line); background:var(--card); color:var(--ink); font:inherit}
.voicebox button{min-height:42px; padding:0 18px; border-radius:999px; border:2px solid var(--blue); background:var(--blue-soft); color:var(--blue-deep); cursor:pointer}

/* ---------- quiz ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px}
.ghost{min-height:44px; padding:0 18px; border-radius:999px; border:2px solid var(--line); background:var(--card); cursor:pointer; font-size:.95rem}
.lesson-name{font-size:.98rem; color:var(--ink-soft); text-align:center; margin-top:-6px}
.progress{display:flex; gap:6px}
.dot{flex:1 1 0; min-width:0; height:10px; border-radius:999px; border:2px solid var(--line); background:var(--card)}
.dot.cur{border-color:var(--blue); background:var(--blue-soft)}
.dot.ok{border-color:var(--yellow-deep); background:var(--yellow)}
.dot.bad{border-color:var(--pink-deep); background:var(--pink)}

.qcard{background:var(--card); border:2px solid var(--line); border-radius:28px; padding:20px; display:grid; align-content:start; gap:16px; box-shadow:var(--lift)}
.qhead{display:flex; align-items:center; justify-content:space-between; gap:8px}
.qscene{flex:1; min-width:0; height:60px; display:flex; justify-content:center}
.qnum{display:inline-block; padding:1px 16px; border-radius:999px; background:var(--yellow); color:var(--on-yellow); font-size:.95rem; letter-spacing:.08em}
.speak{width:46px; height:46px; border-radius:50%; border:2px solid var(--blue); background:var(--blue-soft); color:var(--blue-deep); display:grid; place-items:center; cursor:pointer}
.speak svg{width:22px; height:22px}
.qtext{font-size:1.28rem; line-height:1.75; text-wrap:pretty}
.art{display:flex; justify-content:center; padding:4px 0; min-width:0}
.art-svg{display:block; height:auto; max-width:100%}

.choices{display:grid; gap:12px}
.choice{
  display:flex; align-items:center; gap:14px; width:100%; min-height:62px; padding:10px 16px;
  font-size:1.1rem; text-align:left; cursor:pointer;
  border:2px solid var(--line); border-radius:20px; background:var(--card); box-shadow:0 3px 0 var(--line);
  transition:transform .08s;
}
.choice:hover:not(:disabled){border-color:var(--blue)}
.choice:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.zy{flex:none; width:36px; height:36px; border-radius:50%; background:var(--blue-soft); color:var(--blue-deep); display:grid; place-items:center; font-size:1rem}
.choice .tx{flex:1; min-width:0; font-family:var(--font-num); font-weight:500}
.choice .tx.cn{font-family:var(--font-body); font-weight:400}
.choice:disabled{cursor:default}
.choice:disabled:not(.correct):not(.wrong){opacity:.5}
.choice.correct{background:var(--yellow-soft); border-color:var(--yellow-deep); box-shadow:0 3px 0 var(--yellow-deep)}
.choice.correct .zy{background:var(--yellow); color:var(--on-yellow)}
.choice.correct::after{content:"✓"; font-size:1.4rem; color:var(--blue-deep)}
.choice.wrong{background:var(--pink-soft); border-color:var(--pink-deep); box-shadow:0 3px 0 var(--pink-deep)}
.choice.wrong .zy{background:var(--pink); color:var(--on-pink)}
.choice.wrong::after{content:"✗"; font-size:1.3rem; color:var(--pink-deep)}

.fill{display:grid; gap:12px; justify-items:center}
.fill-lab{color:var(--ink-soft); font-size:.9rem}
.fill-row{display:flex; align-items:center; gap:10px; font-size:1.2rem}
.fill input{
  width:6.2ch; padding:6px 10px; text-align:center; font:500 2rem var(--font-num);
  border:2px solid var(--blue); border-radius:18px; background:var(--card); color:var(--ink);
}
.fill input.correct{background:var(--yellow-soft); border-color:var(--yellow-deep)}
.fill input.wrong{background:var(--pink-soft); border-color:var(--pink-deep)}
.primary{
  min-height:54px; padding:0 30px; border:0; border-radius:999px; cursor:pointer;
  background:var(--btn); color:var(--on-btn); font-size:1.1rem; letter-spacing:.1em; box-shadow:0 4px 0 var(--btn-edge);
}
.primary:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--btn-edge)}
.primary:disabled{opacity:.4; cursor:default}

.feedback{display:grid; grid-template-columns:minmax(0,1fr); justify-items:center; text-align:center; gap:8px; padding:14px 18px 18px; border-radius:24px; border:2px solid}
.feedback .fp{height:78px; max-width:100%}
.feedback.ok{background:var(--yellow-soft); border-color:var(--yellow-deep)}
.feedback.no{background:var(--pink-soft); border-color:var(--pink-deep)}
.feedback h3{font-size:1.2rem; line-height:1.4}
.feedback p{font-size:.98rem; line-height:1.75}
.feedback .primary{margin-top:4px}
.bounce{animation:bounce .7s ease-out 1}
.shake{animation:shake .5s ease-out 1}
@keyframes bounce{0%{transform:translateY(0)}35%{transform:translateY(-14px)}65%{transform:translateY(0)}82%{transform:translateY(-5px)}100%{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
.hero-pig{animation:bob 3.4s ease-in-out infinite}

/* ---------- art pieces ---------- */
.tiles{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.tile{min-width:60px; padding:4px 12px; text-align:center; font:500 1.6rem var(--font-num); letter-spacing:.04em; border-radius:16px; border:2px solid var(--blue); background:var(--blue-soft); color:var(--ink)}
.tile.hi{background:var(--pink-soft); border-color:var(--pink-deep)}
.tile.q{background:var(--yellow-soft); border-color:var(--yellow-deep); border-style:dashed}
.tile.big{font-size:1.8rem; min-width:76px}
.pv{display:grid; grid-template-columns:repeat(3, minmax(0,92px)); gap:10px; justify-content:center}
.pv div{border:2px solid var(--line); border-radius:18px; overflow:hidden; text-align:center; background:var(--card)}
.pv b{display:block; font:500 1.9rem var(--font-num); padding:2px 0}
.pv span{display:block; padding:1px 0; font-size:.85rem; color:var(--on-yellow); background:var(--yellow)}
.pv div:nth-child(1) span{background:var(--blue); color:var(--on-btn)}
.pv div:nth-child(2) span{background:var(--pink); color:var(--on-pink)}
.vert{display:grid; grid-template-columns:1.6rem 2rem 2rem; column-gap:6px; justify-content:center; align-items:center; font:500 2.3rem/1.25 var(--font-num); text-align:center}
.vert .vline{grid-column:1 / -1; height:0; border-top:3px solid var(--ink); margin-top:4px; border-radius:3px}
.vert .vop{color:var(--pink-deep)}
.eq{font:500 1.9rem/1.5 var(--font-num); text-align:center; letter-spacing:.06em; color:var(--ink)}
.eq .ci{display:inline-block; width:1.5em; height:1.5em; line-height:1.4em; border:2px dashed var(--yellow-deep); border-radius:50%; background:var(--yellow-soft); font-size:.9em; vertical-align:middle}
.bx{display:inline-block; width:1.4em; height:1.15em; border:2px dashed var(--yellow-deep); border-radius:8px; background:var(--yellow-soft); vertical-align:-.18em}
.digital{display:inline-block; padding:2px 18px; border-radius:16px; border:2px solid var(--blue); background:var(--blue-soft); font:500 2.1rem var(--font-num); letter-spacing:.08em; font-variant-numeric:tabular-nums}
.pairs{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center}
.art-center{text-align:center}

.f-ink{fill:#4f3647} .f-white{fill:#ffffff}
.blk{fill:var(--blue-soft); stroke:var(--blue); stroke-width:2}
.grid{stroke:var(--blue); stroke-width:1; fill:none; opacity:.55}
.cube{fill:var(--yellow); stroke:var(--yellow-deep); stroke-width:1.5}
.coin{fill:var(--yellow); stroke:var(--yellow-deep); stroke-width:2.5}
.coin5{fill:var(--blue); stroke:var(--blue-deep); stroke-width:2.5}
.coin1{fill:var(--pink); stroke:var(--pink-deep); stroke-width:2.5}
.coin-in{fill:none; stroke:rgba(61,49,0,.28); stroke-width:1.4}
.note{fill:var(--pink-soft); stroke:var(--pink-deep); stroke-width:2.5}
.note-c{fill:var(--pink); stroke:var(--pink-deep); stroke-width:1.8}
.svgtext{fill:var(--ink); font-family:var(--font-num); font-weight:500; text-anchor:middle}
.svgcn{fill:var(--ink); font-family:var(--font-body); font-weight:400; text-anchor:middle}
.coin-t{fill:#2b2300; font-family:var(--font-num); font-weight:500; text-anchor:middle}
.ruler{fill:var(--yellow-soft); stroke:var(--yellow-deep); stroke-width:2.5}
.tick{stroke:var(--ink); stroke-width:1.8; stroke-linecap:round}
.guide{stroke:var(--pink-deep); stroke-width:1.8; stroke-dasharray:4 4}
.seg-b{fill:var(--blue-soft); stroke:var(--blue); stroke-width:2.5}
.seg-p{fill:var(--pink-soft); stroke:var(--pink-deep); stroke-width:2.5}
.seg-y{fill:var(--yellow-soft); stroke:var(--yellow-deep); stroke-width:2.5}
.seg-cut{fill:none; stroke:var(--pink-deep); stroke-width:2.5; stroke-dasharray:6 5}
.plate{fill:var(--blue-soft); stroke:var(--blue); stroke-width:2.5}
.cookie{fill:var(--yellow); stroke:var(--yellow-deep); stroke-width:2}
.apple{fill:var(--pink); stroke:var(--pink-deep); stroke-width:2}
.ball{fill:var(--blue); stroke:var(--blue-deep); stroke-width:2}
.leaf{fill:var(--yellow-deep); stroke:none}
.gbox{fill:var(--blue-soft); stroke:var(--blue); stroke-width:2; stroke-dasharray:5 4}
.cup{fill:none; stroke:var(--blue-deep); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.water{fill:var(--blue); opacity:.55}
.waterfull{fill:var(--blue); opacity:.55}
.cell{stroke-width:2}
.cA{fill:var(--blue-soft); stroke:var(--blue)} .cB{fill:var(--pink-soft); stroke:var(--pink-deep)} .cC{fill:var(--yellow-soft); stroke:var(--yellow-deep)}
.lab-dot{stroke-width:2}
.face{fill:var(--card); stroke:var(--blue); stroke-width:4}
.ear{fill:var(--pink); stroke:var(--pink-deep); stroke-width:3}
.hand-h{stroke:var(--pink-deep); stroke-width:6; stroke-linecap:round}
.hand-m{stroke:var(--blue-deep); stroke-width:4; stroke-linecap:round}
.cdot{fill:var(--ink)}


/* bars (html, so zhuyin can apply) */
.bars{display:grid; gap:12px; width:min(100%,380px); margin-inline:auto}
.brow{display:flex; min-width:0}
.bs{display:flex; align-items:center; justify-content:center; min-width:0; min-height:42px; padding:0 4px; text-align:center; font-size:.98rem; line-height:1.3; border:2.5px solid; border-radius:10px}
.brow > .bs + .bs{margin-left:-2.5px}
.bs.b{background:var(--blue-soft); border-color:var(--blue)}
.bs.p{background:var(--pink-soft); border-color:var(--pink-deep)}
.bs.y{background:var(--yellow-soft); border-color:var(--yellow-deep)}
.bs.cut{border-style:dashed; border-color:var(--pink-deep); background:transparent}
.bs.cb{border-radius:0; font-size:.95rem; min-height:36px}
.blk-art .bs.cb{min-height:28px}
.brace{height:9px; border:2.5px solid var(--pink-deep); border-top:0; border-radius:0 0 6px 6px; margin-top:-4px}
.bcap{font-size:.92rem; color:var(--ink)} .bcap.mid{text-align:center}
.brow.bw{align-items:center; gap:8px}
.bs.cb + .bs.cb{margin-left:-2.5px}


/* ---------- 注音（字的右邊直排，聲調在注音右側，輕聲在上方） ---------- */
.zbtn{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px 0 8px; border-radius:999px; border:2px solid var(--yellow-deep); background:var(--yellow-soft); color:var(--on-yellow); cursor:pointer; font-size:.95rem; line-height:1}
:root[data-theme="dark"] .zbtn{color:var(--ink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .zbtn{color:var(--ink)} }
.zbtn .zi{display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--yellow); color:var(--on-yellow); font-size:.7rem; letter-spacing:0}
.zbtn .zst{min-width:1.6em; padding:2px 8px; border-radius:999px; background:var(--card); border:1.5px solid var(--yellow-deep); color:var(--ink); text-align:center; font-size:.85rem}
.zbtn[aria-pressed="false"]{border-color:var(--line); background:var(--card); color:var(--ink-soft)}
.zbtn[aria-pressed="false"] .zi{background:var(--line); color:var(--ink-soft)}
.topbar .zbtn{min-height:44px}
.hero .zbtn{margin-top:4px}
.zyy{display:none}
.z,.zw,.zc{display:inline}
body.zhy{line-height:1.9}
body.zhy .zw{white-space:nowrap}
body.zhy .z{position:relative; display:inline-block; padding-right:1.3em}
body.zhy .z.t1{padding-right:1.18em}
body.zhy .zyy{display:block; position:absolute; left:1.9em; top:50%; transform:translateY(-52%); width:.5em; font-size:.55em; color:var(--ink); line-height:1; font-family:var(--font-body); font-weight:400; letter-spacing:0; text-align:center; user-select:none; -webkit-user-select:none; pointer-events:none}

body.zhy .ys{display:flex; flex-direction:column; align-items:center}
body.zhy .ys i{display:block; font-style:normal; line-height:.98}
body.zhy .yt{position:absolute; left:100%; top:50%; transform:translateY(-50%); margin-left:.04em; line-height:1}
body.zhy .yt.n{left:50%; top:auto; bottom:100%; transform:translateX(-50%); margin:0 0 .05em}
body.zhy .qtext{font-size:1.32rem; line-height:2.2}
body.zhy .choice{min-height:68px}
body.zhy .choice .tx{font-size:1.14rem; line-height:2}
body.zhy .lesson .nm{line-height:2}
body.zhy .lesson .no{font-size:.9rem}
body.zhy h1{line-height:1.75}
body.zhy .lede{line-height:2}
body.zhy .feedback h3{line-height:1.9}
body.zhy .feedback p, body.zhy .rv, body.zhy .res h2{line-height:2.05}
body.zhy .res h2{font-size:1.4rem}
body.zhy .qnum{line-height:1.8; padding:0 14px}
body.zhy .bs{line-height:1.9; min-height:48px}
body.zhy .ghost, body.zhy .primary, body.zhy .secondary{line-height:1.7}
body.zhy .primary,body.zhy .secondary{min-height:58px}
body.zhy .fill-lab{line-height:1.9}
body.zhy .fill-row{font-size:1.25rem}
@media (max-width:420px){
  body.zhy .qtext{font-size:1.24rem}
  body.zhy .choice .tx{font-size:1.08rem}
}

/* ---------- result ---------- */
.res{background:var(--card); border:2px solid var(--line); border-radius:28px; padding:24px 20px; display:grid; gap:14px; justify-items:center; text-align:center; box-shadow:var(--lift)}
.res .rp{height:116px; max-width:100%}
.res h2{font-size:1.45rem; line-height:1.5; text-wrap:balance}
.stars{display:flex; gap:8px}
.stars svg{width:50px; height:50px}
.star-on{fill:var(--yellow); stroke:var(--yellow-deep); stroke-width:3; stroke-linejoin:round}
.star-off{fill:none; stroke:var(--line); stroke-width:3; stroke-linejoin:round; stroke-dasharray:5 5}
.score{font:500 1.5rem var(--font-num); letter-spacing:.04em}
.review{width:100%; text-align:left; display:grid; gap:10px}
.review h3{font-size:1rem; color:var(--ink-soft)}
.rv{padding:10px 14px; border-radius:16px; background:var(--pink-soft); border:2px solid var(--pink-deep); font-size:.95rem; line-height:1.7}
.rv small{display:block; color:var(--ink-soft); font-size:.8rem}
.rv .ansn{font-family:var(--font-num); font-weight:500}
.actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
.secondary{min-height:54px; padding:0 24px; border-radius:999px; border:2px solid var(--blue); background:var(--card); color:var(--blue-deep); font-size:1.05rem; cursor:pointer}

@media (max-width:420px){
  body{font-size:16px}
  .hero-pig{height:84px}
  .qcard{padding:16px}
  .qtext{font-size:1.18rem}
  .tile{min-width:52px; padding:4px 8px; font-size:1.4rem}
  .tile.big{min-width:66px; font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>

<div class="wrap">

  <section id="home" class="screen">
    <header class="hero">
      <div class="hero-pig" id="heroPig"></div>
      <div>
        <p class="eyebrow" data-nozy>翰林版 · 二年級上學期</p>
        <h1>二年級數學小測驗</h1>
        <p class="lede">選一個單元，每次從題庫隨機抽 10 題。答對就能集星星！</p>
        <button type="button" class="zbtn" aria-pressed="true"><span class="zi" aria-hidden="true">ㄅㄆ</span><span data-nozy>注音</span><span class="zst" data-nozy>開</span></button>
      </div>
    </header>
    <div class="lessons" id="lessonList"></div>
    <p class="foot" data-nozy>每個單元有 150 題，每次玩都會抽到不同的題目，還會有幾題要仔細讀題的題目。<br>題目旁邊的喇叭，可以把題目唸給你聽。</p>
    <div class="voicebox" id="voiceBox" hidden data-nozy>
      <label for="voiceSel">朗讀聲音</label>
      <select id="voiceSel"></select>
      <button type="button" id="voiceTest">試聽</button>
    </div>
  </section>

  <section id="quiz" class="screen" hidden>
    <div class="topbar">
      <button id="backBtn" class="ghost" type="button">← 回選單</button>
      <button type="button" class="zbtn" aria-pressed="true"><span class="zi" aria-hidden="true">ㄅㄆ</span><span data-nozy>注音</span><span class="zst" data-nozy>開</span></button>
    </div>
    <div class="lesson-name" id="qLesson"></div>
    <div class="progress" id="progress"></div>
    <article class="qcard">
      <div class="qhead">
        <span class="qnum num" id="qNum"></span>
        <div class="qscene" id="qScene"></div>
        <button id="speakBtn" class="speak" type="button" aria-label="把題目唸給我聽">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
      </div>
      <h2 class="qtext" id="qText"></h2>
      <div class="art" id="qArt"></div>
      <div id="qAnswer"></div>
    </article>
    <div id="feedback" class="feedback" hidden aria-live="polite"></div>
  </section>

  <section id="result" class="screen" hidden>
    <div class="res" id="resBox"></div>
  </section>

</div>

<script>
"use strict";

/* =====================================================================
   一、小工具
   ===================================================================== */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function R(r, a, b){ return a + Math.floor(r() * (b - a + 1)); }
function pick(r, arr){ return arr[Math.floor(r() * arr.length)]; }
function shuffle(r, arr){
  var a = arr.slice(), i, j, t;
  for(i = a.length - 1; i > 0; i--){ j = Math.floor(r() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function wrap12(x){ return ((x - 1) % 12 + 12) % 12 + 1; }
function twoOf(r, arr){
  var a = pick(r, arr), b = pick(r, arr), g = 0;
  while(b === a && g++ < 50) b = pick(r, arr);
  return [a, b];
}
var D = ["零","一","二","三","四","五","六","七","八","九"];
function cn(n){
  var h = Math.floor(n / 100), t = Math.floor(n % 100 / 10), o = n % 10, s = "";
  if(h) s += D[h] + "百";
  if(t){ s += D[t] + "十"; if(o) s += D[o]; }
  else if(o){ s += (h ? "零" : "") + D[o]; }
  return s;
}

/* 題目建構：MC 選項會打亂；MCF 選項順序固定；FILL 是填空 */
function MC(key, text, art, right, wrongs, exp, r){
  var seen = {}, opts = [String(right)], sh;
  seen[String(right)] = 1;
  wrongs.forEach(function(w){ w = String(w); if(!seen[w]){ seen[w] = 1; opts.push(w); } });
  opts = opts.slice(0, 3);
  sh = shuffle(r, opts);
  return { t:"mc", key:key, text:text, art:art || "", ch:sh, a:sh.indexOf(String(right)), exp:exp };
}
function MCF(key, text, art, choices, ai, exp){
  return { t:"mc", key:key, text:text, art:art || "", ch:choices.map(String), a:ai, exp:exp };
}
function FILL(key, text, art, ans, unit, exp){
  return { t:"fill", key:key, text:text, art:art || "", a:String(ans), unit:unit || "", exp:exp };
}

/* 故事用的角色與物品 */
var PIGN = ["小豬","粉粉","胖胖","呆呆","哼哼","團團","桃桃","波波"];
var OBJ = [["蘋果","顆"],["餅乾","塊"],["貼紙","張"],["彈珠","顆"],["氣球","個"],["糖果","顆"],["鉛筆","枝"],["小花","朵"],["貝殼","個"],["紙鶴","隻"]];
var EDIBLE = ["蘋果", "餅乾", "糖果"];
/* 依物品選擇通順的動詞：能吃的可以「吃掉」，其他的用「送給朋友」或「用掉」 */
function lessVerb(r, o){ return EDIBLE.indexOf(o[0]) >= 0 ? pick(r, ["吃掉", "送給朋友"]) : pick(r, ["送給朋友", "用掉"]); }

/* =====================================================================
   二、小豬（原創角色：簡單線條、圓滾滾、有點呆的日式滑稽風）
   ===================================================================== */
var LN = "#80586a";
var PCOL = [
  { b:"#ffcadd", d:"#ffa9c6", s:"#ff9dbd" },
  { b:"#ffe9a8", d:"#ffd470", s:"#ffc47c" },
  { b:"#d3e8ff", d:"#a3cbf6", s:"#93bff0" }
];
function sk(w){ return 'stroke="' + LN + '" stroke-width="' + (w || 2.4) + '" stroke-linecap="round" stroke-linejoin="round"'; }

var ACC = {
  cube:    '<g transform="rotate(-10 50 20)"><rect x="41" y="8" width="17" height="17" rx="3.5" fill="#ffd96b" ' + sk(2) + '/><path d="M45 14h9" ' + sk(1.6) + '/></g>',
  glasses: '<circle cx="31" cy="53" r="9.5" fill="#ffffff" fill-opacity=".4" ' + sk(2) + '/><circle cx="69" cy="53" r="9.5" fill="#ffffff" fill-opacity=".4" ' + sk(2) + '/><path d="M40.5 52h19" ' + sk(2) + '/>',
  pencil:  '<g transform="rotate(32 80 26)"><rect x="76" y="6" width="7" height="30" fill="#ffd96b" ' + sk(1.8) + '/><rect x="76" y="6" width="7" height="6" fill="#ff9dbd" ' + sk(1.8) + '/><path d="M76 36l3.5 7 3.5-7z" fill="#fff0d0" ' + sk(1.6) + '/></g>',
  band:    '<path d="M16 45Q50 32 84 45" fill="none" stroke="#5aa5f2" stroke-width="7" stroke-linecap="round"/><circle cx="83" cy="46" r="4.5" fill="#5aa5f2" ' + sk(1.6) + '/>',
  towel:   '<path d="M32 28Q33 12 50 11Q67 12 68 28Q50 22 32 28Z" fill="#dcecff" ' + sk(2) + '/><path d="M40 18h20" ' + sk(1.4) + ' opacity=".5"/>',
  bow:     '<g transform="translate(26 28) rotate(-18)"><path d="M0 0L-11-7L-11 7ZM0 0L11-7L11 7Z" fill="#5aa5f2" ' + sk(1.8) + '/><circle r="3.4" fill="#ffd96b" ' + sk(1.6) + '/></g>',
  crown:   '<path d="M35 29L37 13L44 21L50 10L56 21L63 13L65 29Z" fill="#ffd96b" ' + sk(2) + '/>',
  clock:   '<circle cx="50" cy="17" r="10" fill="#ffffff" ' + sk(2) + '/><path d="M50 17V11M50 17l5 3" ' + sk(1.8) + '/><path d="M42 9l-3-3M58 9l3-3" ' + sk(2) + '/>',
  star:    '<path d="M27 17l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z" fill="#ffd96b" ' + sk(1.8) + '/>',
  flower:  '<g transform="translate(77 27)"><circle cx="5.5" cy="0" r="3.8" fill="#fff" ' + sk(1.4) + '/><circle cx="1.7" cy="5.2" r="3.8" fill="#fff" ' + sk(1.4) + '/><circle cx="-4.4" cy="3.2" r="3.8" fill="#fff" ' + sk(1.4) + '/><circle cx="-4.4" cy="-3.2" r="3.8" fill="#fff" ' + sk(1.4) + '/><circle cx="1.7" cy="-5.2" r="3.8" fill="#fff" ' + sk(1.4) + '/><circle r="3" fill="#ffd96b" ' + sk(1.4) + '/></g>'
};
var PROP = {
  cube:   '<rect x="72" y="76" width="14" height="14" rx="2.5" fill="#ffd96b" ' + sk(1.8) + '/><rect x="82" y="63" width="14" height="14" rx="2.5" fill="#dcecff" ' + sk(1.8) + '/>',
  plus:   '<circle cx="86" cy="78" r="13" fill="#ffd96b" ' + sk(2) + '/><path d="M80 78h12M86 72v12" ' + sk(3) + '/>',
  ruler:  '<g transform="rotate(-22 84 78)"><rect x="69" y="71" width="32" height="13" rx="2.5" fill="#fff4c9" ' + sk(1.8) + '/><path d="M76 71v5M82 71v7M88 71v5M94 71v7" ' + sk(1.4) + '/></g>',
  arrows: '<path d="M71 72h22m-6-5l6 5-6 5" fill="none" stroke="#5aa5f2" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M97 86H75m6-5l-6 5 6 5" fill="none" stroke="#ff8fb3" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>',
  cup:    '<path d="M76 77h18v10q0 4-4 4H80q-4 0-4-4z" fill="#93bff0"/><path d="M75 66v21q0 5 5 5h10q5 0 5-5V66" fill="none" ' + sk(2) + '/>',
  balls:  '<circle cx="78" cy="86" r="6.5" fill="#a3cbf6" ' + sk(1.8) + '/><circle cx="91" cy="86" r="6.5" fill="#ffd96b" ' + sk(1.8) + '/><circle cx="84.5" cy="74" r="6.5" fill="#ffa9c6" ' + sk(1.8) + '/>',
  cookie: '<circle cx="86" cy="80" r="12" fill="#ffd96b" ' + sk(2) + '/><circle cx="82" cy="76" r="1.7" fill="#a0663c"/><circle cx="90" cy="79" r="1.7" fill="#a0663c"/><circle cx="84" cy="86" r="1.7" fill="#a0663c"/>',
  clock:  '<circle cx="86" cy="79" r="12.5" fill="#ffffff" ' + sk(2) + '/><path d="M86 79V70M86 79l7 4" ' + sk(2) + '/>',
  times:  '<path d="M76 68l20 20M96 68L76 88" stroke="' + LN + '" stroke-width="8.5" stroke-linecap="round"/><path d="M76 68l20 20M96 68L76 88" stroke="#ff8fb3" stroke-width="5" stroke-linecap="round"/>',
  tile:   '<rect x="73" y="67" width="12" height="12" fill="#dcecff" ' + sk(1.8) + '/><rect x="85" y="67" width="12" height="12" fill="#ffd96b" ' + sk(1.8) + '/><rect x="73" y="79" width="12" height="12" fill="#ffd96b" ' + sk(1.8) + '/><rect x="85" y="79" width="12" height="12" fill="#ffa9c6" ' + sk(1.8) + '/>'
};

/* 小豬本體：座標 0～100。mood：happy / cheer / oops / deadpan / sleepy / wow / blep */
function pigG(o){
  var c = PCOL[o.col || 0], mood = o.mood || "happy", eyes, mouth = "", extra = "", armL, armR, g;
  var BODY = "M15 63C10 42 27 29 50 29C73 29 91 41 86 63C83 81 69 88 50 88C31 88 17 82 15 63Z";
  var dot = function(x, y, r){ return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + LN + '"/>'; };
  armL = '<ellipse cx="12" cy="68" rx="6.5" ry="5" fill="' + c.d + '" ' + sk(2.2) + '/>';
  armR = '<ellipse cx="88" cy="68" rx="6.5" ry="5" fill="' + c.d + '" ' + sk(2.2) + '/>';
  if(mood === "cheer"){
    eyes = '<path d="M25 55Q31 46 37 55M63 55Q69 46 75 55" fill="none" ' + sk(2.6) + '/>';
    mouth = '<path d="M43 75Q50 89 57 75Z" fill="#e8587f" ' + sk(2.2) + '/>';
    armL = '<ellipse cx="10" cy="47" rx="5" ry="7.5" transform="rotate(-22 10 47)" fill="' + c.d + '" ' + sk(2.2) + '/>';
    armR = '<ellipse cx="90" cy="47" rx="5" ry="7.5" transform="rotate(22 90 47)" fill="' + c.d + '" ' + sk(2.2) + '/>';
    extra = '<path d="M5 24v7M1.5 27.5h7M95 20v7M91.5 23.5h7" ' + sk(2) + ' stroke="#e0ad00"/>';
  } else if(mood === "oops"){
    eyes = dot(31, 55, 2.5) + dot(69, 55, 2.5);
    mouth = '<path d="M43 79q3.5-3.5 7 0t7 0" fill="none" ' + sk(2.2) + '/>';
    extra = '<path d="M22 36v11M28 34v13M34 36v11" fill="none" stroke="#6a9fe0" stroke-width="2.2" stroke-linecap="round"/>' +
            '<path d="M83 30q6.5 9 0 13.5q-6.5-4.5 0-13.5z" fill="#a5d3ff" ' + sk(1.6) + '/>';
  } else if(mood === "deadpan"){
    eyes = dot(31, 54.5, 2.6) + dot(69, 54.5, 2.6) + '<path d="M25.5 51h11M63.5 51h11" fill="none" ' + sk(2.2) + '/>';
    mouth = '<path d="M45 78.5h10" fill="none" ' + sk(2.2) + '/>';
  } else if(mood === "sleepy"){
    eyes = '<path d="M25 53Q31 59 37 53M63 53Q69 59 75 53" fill="none" ' + sk(2.4) + '/>';
    mouth = '<ellipse cx="50" cy="78.5" rx="2.2" ry="2.8" fill="#e8587f" ' + sk(1.6) + '/>';
    extra = '<path d="M80 22h7l-7 7h7" fill="none" stroke="#5aa5f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  } else if(mood === "wow"){
    eyes = '<circle cx="31" cy="52" r="5.2" fill="#fff" ' + sk(2) + '/>' + dot(31.6, 52.4, 2) + '<circle cx="69" cy="52" r="5.2" fill="#fff" ' + sk(2) + '/>' + dot(68.4, 52.4, 2);
    mouth = '<ellipse cx="50" cy="79.5" rx="3.2" ry="3.8" fill="#e8587f" ' + sk(1.8) + '/>';
  } else if(mood === "blep"){
    eyes = dot(31, 53, 2.9) + dot(69, 53, 2.9);
    mouth = '<path d="M45 77.5Q50 80.5 55 77.5" fill="none" ' + sk(2.2) + '/><path d="M50.5 78.5q0 7.5 4.2 6.2q3-3.2-.8-7z" fill="#ff7fa6" ' + sk(1.6) + '/>';
  } else {
    eyes = dot(31, 53, 2.9) + dot(69, 53, 2.9);
    mouth = '<path d="M44.5 77.5Q50 82.5 55.5 77.5" fill="none" ' + sk(2.2) + '/>';
  }
  g = '<ellipse cx="36" cy="89" rx="8.5" ry="5" fill="' + c.d + '" ' + sk(2.2) + '/><ellipse cx="64" cy="89" rx="8.5" ry="5" fill="' + c.d + '" ' + sk(2.2) + '/>' +
      armL + armR +
      '<path d="M25 39C16 33 13 23 17 19C27 19 37 24 42 31Z" fill="' + c.d + '" ' + sk(2.2) + '/><path d="M66 31C73 25 81 21 86 24C88 32 85 40 81 44Z" fill="' + c.d + '" ' + sk(2.2) + '/>' +
      '<path d="' + BODY + '" fill="' + c.b + '" ' + sk(2.4) + '/>' +
      '<ellipse cx="23" cy="66" rx="5" ry="3.2" fill="#ff7fa6" opacity=".4"/><ellipse cx="77" cy="66" rx="5" ry="3.2" fill="#ff7fa6" opacity=".4"/>' +
      '<ellipse cx="50" cy="64" rx="12.5" ry="8.5" fill="' + c.s + '" ' + sk(2.2) + '/>' +
      '<ellipse cx="45.5" cy="64" rx="1.7" ry="2.7" fill="' + LN + '"/><ellipse cx="54.5" cy="64" rx="1.7" ry="2.7" fill="' + LN + '"/>' +
      eyes + mouth + extra + (o.acc ? ACC[o.acc] : "") + (o.prop ? PROP[o.prop] : "");
  return g;
}
function pigSvg(o){ return '<svg class="pigsvg" viewBox="0 0 100 100" role="img" aria-label="小豬">' + pigG(o) + '</svg>'; }

/* 每個單元自己的造型：頭上配件 + 手上道具，第二、三隻小豬戴不同配件 */
var UNIT_STYLE = {
  1:  { acc:"cube",    prop:"cube",   acc2:"bow",     acc3:"star" },
  2:  { acc:"glasses", prop:"plus",   acc2:"band",    acc3:"cube" },
  3:  { acc:"pencil",  prop:"ruler",  acc2:"star",    acc3:"towel" },
  4:  { acc:"band",    prop:"arrows", acc2:"glasses", acc3:"bow" },
  5:  { acc:"towel",   prop:"cup",    acc2:"flower",  acc3:"clock" },
  6:  { acc:"bow",     prop:"balls",  acc2:"cube",    acc3:"crown" },
  7:  { acc:"crown",   prop:"cookie", acc2:"pencil",  acc3:"flower" },
  8:  { acc:"clock",   prop:"clock",  acc2:"towel",   acc3:"star" },
  9:  { acc:"star",    prop:"times",  acc2:"crown",   acc3:"glasses" },
  10: { acc:"flower",  prop:"tile",   acc2:"clock",   acc3:"band" }
};
/* n 隻小豬排成一排；seed 決定顏色、角度、是否轉向，讓每次看起來不一樣 */
function pigScene(n, moods, unit, seed){
  var gap = 76, W = 100 + (n - 1)*gap, g = "", i, k, sc, x, y, rot, flip, acc,
      cfg = UNIT_STYLE[unit] || UNIT_STYLE[1], order = [[0, 1, 2], [1, 2, 0], [2, 0, 1], [0, 2, 1]][seed % 4];
  for(i = 0; i < n; i++){
    k = (i + seed) % 3; sc = [1, .9, .95][k]; rot = [-4, 5, -3][k]; flip = (i + seed) % 2 === 1;
    x = i*gap + 50*(1 - sc); y = 100*(1 - sc);
    acc = i === 0 ? cfg.acc : (i === 1 ? cfg.acc2 : cfg.acc3);
    g += '<g transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') scale(' + sc + ')"><g transform="rotate(' + rot + ' 50 70)' + (flip ? ' translate(100 0) scale(-1 1)' : '') + '">' +
         pigG({ mood:moods[i % moods.length], col:order[i % 3], acc:acc, prop:i === 0 ? cfg.prop : null }) + '</g></g>';
  }
  return '<svg class="pigsvg" viewBox="0 0 ' + W + ' 100" role="img" aria-label="' + n + ' 隻小豬">' + g + '</svg>';
}
/* 題目上方的小豬：隻數與表情每題不同 */
var HEAD_PLAN = [[1, ["happy"]], [2, ["deadpan", "happy"]], [3, ["wow", "happy", "deadpan"]], [2, ["happy", "sleepy"]], [1, ["blep"]], [3, ["happy", "deadpan", "wow"]], [2, ["wow", "happy"]], [3, ["sleepy", "happy", "blep"]], [1, ["deadpan"]], [2, ["happy", "happy"]]];
var OK_PLAN = [[1, ["cheer"]], [2, ["cheer", "deadpan"]], [3, ["cheer", "cheer", "deadpan"]], [2, ["cheer", "cheer"]], [3, ["deadpan", "cheer", "cheer"]], [1, ["cheer"]], [2, ["cheer", "blep"]], [3, ["cheer", "cheer", "cheer"]], [1, ["cheer"]], [2, ["cheer", "cheer"]]];
var BAD_PLAN = [[1, ["oops"]], [2, ["oops", "deadpan"]], [3, ["oops", "deadpan", "sleepy"]], [2, ["oops", "wow"]], [3, ["deadpan", "oops", "wow"]], [1, ["oops"]], [2, ["oops", "deadpan"]], [3, ["oops", "wow", "deadpan"]], [1, ["oops"]], [2, ["oops", "sleepy"]]];
function planScene(plan, idx, unit, seed){ var p = plan[idx % plan.length]; return pigScene(p[0], p[1], unit, seed); }

/* =====================================================================
   三、插圖零件
   ===================================================================== */
var S = 9;
function flat(x, y){
  var d = "", i;
  for(i = 1; i < 10; i++){ d += "M" + (x + i*S) + " " + y + "V" + (y + S*10) + "M" + x + " " + (y + i*S) + "H" + (x + S*10); }
  return '<rect x="' + x + '" y="' + y + '" width="' + (S*10) + '" height="' + (S*10) + '" rx="3" class="blk"/><path d="' + d + '" class="grid"/>';
}
function rod(x, y){
  var d = "", i;
  for(i = 1; i < 10; i++){ d += "M" + x + " " + (y + i*S) + "H" + (x + S); }
  return '<rect x="' + x + '" y="' + y + '" width="' + S + '" height="' + (S*10) + '" rx="2" class="blk"/><path d="' + d + '" class="grid"/>';
}
function cube(x, y){ return '<rect x="' + x + '" y="' + y + '" width="' + S + '" height="' + S + '" rx="2" class="cube"/>'; }
function wrapSvg(w, h, inner, maxw, label){
  return '<svg class="art-svg" viewBox="0 0 ' + w + ' ' + h + '" style="width:min(100%,' + Math.round(maxw) + 'px)" role="img" aria-label="' + (label || "插圖") + '">' + inner + '</svg>';
}
function blocksSvg(h, t, o){
  var x = 4, g = "", i;
  for(i = 0; i < h; i++){ g += flat(x, 6); x += S*10 + 10; }
  if(h) x += 6;
  for(i = 0; i < t; i++){ g += rod(x, 6); x += S + 4; }
  if(t) x += 10;
  for(i = 0; i < o; i++){ g += cube(x + (i % 3)*(S + 3), 6 + Math.floor(i/3)*(S + 3)); }
  var w = x + Math.min(o, 3)*(S + 3) + 4;
  return wrapSvg(w, 102, g, w*1.8, "積木圖");
}
function moneySvg(items){
  var x = 4, g = "";
  items.forEach(function(d){

    $("resBox").innerHTML =
      '<div class="rp ' + (reduce ? "" : "bounce") + '">' + pigScene(score >= 9 ? 3 : 2, score >= 9 ? ["cheer", "cheer", "cheer"] : (score >= 6 ? ["cheer", "deadpan"] : ["deadpan", "blep"]), cur.unit.id, 2) + '</div>' +
      '<h2>' + msg + '</h2>' +
      '<div class="stars" role="img" aria-label="得到 ' + n + ' 顆星">' + stars + '</div>' +
      '<p class="score">答對 ' + score + ' / 10 題</p>' +
      (wrong.length ? '<div class="review"><h3>這幾題再看一次</h3>' + wrong.join("") + '</div>' : '<p>10 題全部答對，沒有要複習的題目！</p>') +
      '<div class="actions"><button type="button" class="primary" id="againBtn">再抽 10 題</button>' +
      (next ? '<button type="button" class="secondary" id="nextUnitBtn">下一個單元</button>' : '') +
      '<button type="button" class="secondary" id="homeBtn">回選單</button></div>';
    zyApply($("resBox"));
    show("result");
    $("againBtn").addEventListener("click", function(){ startUnit(cur.unit.id); });
    if(next){ $("nextUnitBtn").addEventListener("click", function(){ startUnit(next.id); }); }
    $("homeBtn").addEventListener("click", goHome);
  }

  function goHome(){ renderHome(); show("home"); }

  $("lessonList").addEventListener("click", function(ev){
    var b = ev.target.closest("[data-unit]");
    if(b) startUnit(Number(b.getAttribute("data-unit")));
  });
  $("backBtn").addEventListener("click", goHome);
  $("qAnswer").addEventListener("click", function(ev){
    var b = ev.target.closest(".choice");
    if(!b || cur.answered) return;
    var q = cur.qs[cur.idx], i = Number(b.getAttribute("data-i")), ok = i === q.a;
    $("qAnswer").querySelectorAll(".choice").forEach(function(el, k){
      el.disabled = true;
      if(k === q.a) el.classList.add("correct"); else if(k === i) el.classList.add("wrong");
    });
    finishQuestion(ok, q.ch[q.a]);
  });

  var canSpeak = false, voiceList = [];
  try { canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined"; } catch(e){}
  if(!canSpeak){ $("speakBtn").hidden = true; }

  /* 幫每個聲音打分數：台灣華語優先，名稱有 Natural / Online / Neural 等的通常比較自然 */
  function voiceScore(v){
    var l = (v.lang || "").replace("_", "-").toLowerCase(), n = v.name || "", sc = 0;
    if(!(l === "zh-tw" || l.indexOf("zh-hant") === 0 || /Taiwan|台灣|臺灣/i.test(n))) return -1;
    sc = 100;
    if(/Natural|Online|Neural|Premium|Enhanced/i.test(n)) sc += 40;
    if(/HsiaoChen|HsiaoYu|YunJhe|Mei-?Jia|美佳|Google/i.test(n)) sc += 15;
    return sc;
  }
  function loadVoices(){
    if(!canSpeak) return;
    var all = [], sel = $("voiceSel"), keep = "", saved = "", idx = 0, i;
    try { all = window.speechSynthesis.getVoices() || []; } catch(e){}
    if(voiceList[Number(sel.value)]) keep = voiceList[Number(sel.value)].v.voiceURI;
    try { saved = localStorage.getItem("math2-voice") || ""; } catch(e){}
    voiceList = all.map(function(v){ return { v:v, s:voiceScore(v) }; }).filter(function(x){ return x.s >= 0; }).sort(function(a, b){ return b.s - a.s; });
    sel.innerHTML = voiceList.map(function(x, k){ return '<option value="' + k + '">' + x.v.name + '（' + x.v.lang + '）</option>'; }).join("");
    for(i = 0; i < voiceList.length; i++){ if(voiceList[i].v.voiceURI === (keep || saved)){ idx = i; break; } }
    if(voiceList.length) sel.value = String(idx);
    $("voiceBox").hidden = voiceList.length === 0;
  }
  function speak(text){
    if(!canSpeak) return;
    try {
      var u = new SpeechSynthesisUtterance(text), pk = voiceList[Number($("voiceSel").value)];
      window.speechSynthesis.cancel();
      if(pk){ u.voice = pk.v; u.lang = pk.v.lang; } else { u.lang = "zh-TW"; }
      u.rate = 0.82; u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    } catch(e){}
  }
  if(canSpeak){
    loadVoices();
    try { window.speechSynthesis.addEventListener("voiceschanged", loadVoices); } catch(e){ try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch(e2){} }
    $("voiceSel").addEventListener("change", function(){
      var pk = voiceList[Number($("voiceSel").value)];
      try { if(pk) localStorage.setItem("math2-voice", pk.v.voiceURI); } catch(e){}
      speak("你好，我們來玩數學小測驗。");
    });
    $("voiceTest").addEventListener("click", function(){ speak("你好，我們來玩數學小測驗。"); });
  }
  $("speakBtn").addEventListener("click", function(){
    speak(cur.qs[cur.idx].text.replace(/×/g, "乘").replace(/−/g, "減").replace(/\+/g, "加").replace(/○/g, "圈圈").replace(/□/g, "方塊"));
  });

  Array.prototype.forEach.call(document.querySelectorAll(".zbtn"), function(b){ b.addEventListener("click", function(){ zySet(!zyOn); }); });
  zySet(zyOn);
  renderHome();
})();
</script>
</body>
</html>
