<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二年級數學小測驗</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Quicksand:wght@500;600&display=swap">
<style>
/* Layout: one centered column. Home (ten unit cards) -> quiz (one question at a time) -> result (stars + review). */
:root{
  color-scheme:light;
  --bg:#eaf4ff; --dot:#d6e7fb; --card:#ffffff; --ink:#263f5f; --ink-soft:#5d7392;
  --blue:#5aa5f2; --blue-deep:#2468c4; --blue-soft:#dcecff;
  --yellow:#ffd96b; --yellow-deep:#e0ad00; --yellow-soft:#fff4c9; --on-yellow:#3d3100;
  --pink:#ffc6da; --pink-deep:#d4487f; --pink-soft:#ffe9f1; --on-pink:#4d1833;
  --line:#c6dbf4; --btn:#2f7de1; --on-btn:#ffffff; --btn-edge:#1d5cb0;
  --lift:0 12px 24px -16px rgba(36,104,196,.55);
  --font-body:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --font-num:'Quicksand','Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101f3a; --dot:#193259; --card:#18305a; --ink:#eaf3ff; --ink-soft:#aac0df;
    --blue:#6fb2ff; --blue-deep:#a3cfff; --blue-soft:#25477a;
    --yellow:#ffd96b; --yellow-deep:#ffd96b; --yellow-soft:#52471f;
    --pink:#ff9fc2; --pink-deep:#ff9fc2; --pink-soft:#4f2b46;
    --line:#37598a; --btn:#5aa8ff; --on-btn:#0b2447; --btn-edge:#3a7bc4;
    --lift:0 12px 24px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101f3a; --dot:#193259; --card:#18305a; --ink:#eaf3ff; --ink-soft:#aac0df;
  --blue:#6fb2ff; --blue-deep:#a3cfff; --blue-soft:#25477a;
  --yellow:#ffd96b; --yellow-deep:#ffd96b; --yellow-soft:#52471f;
  --pink:#ff9fc2; --pink-deep:#ff9fc2; --pink-soft:#4f2b46;
  --line:#37598a; --btn:#5aa8ff; --on-btn:#0b2447; --btn-edge:#3a7bc4;
  --lift:0 12px 24px -16px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-weight:400; font-size:17px; line-height:1.7; letter-spacing:.03em;
  background-image:radial-gradient(var(--dot) 1.6px, transparent 1.6px); background-size:30px 30px;
  padding-block:20px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
h1,h2,h3,h4,b,strong,button,th{font-weight:400}
h1,h2,h3,p{margin:0}
button{font:inherit; letter-spacing:inherit; color:inherit}
.wrap{max-width:720px; margin-inline:auto}
.screen{display:grid; gap:20px}
:focus-visible{outline:3px solid var(--yellow-deep); outline-offset:3px}
.num{font-family:var(--font-num); font-weight:500; letter-spacing:.02em}

/* ---------- home ---------- */
.hero{display:grid; grid-template-columns:auto minmax(0,1fr); gap:18px; align-items:center; padding:6px 0 2px}
.hero-pig{width:104px; height:104px}
.hero-pig svg{width:100%; height:100%; display:block}
.eyebrow{font-size:.82rem; color:var(--blue-deep); letter-spacing:.14em}
h1{font-size:clamp(1.7rem,6.4vw,2.2rem); line-height:1.3; text-wrap:balance; margin-top:2px}
.lede{margin-top:6px; color:var(--ink-soft); font-size:.98rem}
.lessons{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:14px}
.lesson{
  display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:center;
  padding:14px 16px; border-radius:24px; border:2px solid; text-align:left; cursor:pointer; box-shadow:var(--lift);
  transition:transform .12s ease;
}
.lesson:hover{transform:translateY(-2px)}
.lesson:active{transform:translateY(1px)}
.lesson .ico{width:60px; height:60px; display:block}
.lesson .no{font-size:.8rem; letter-spacing:.14em}
.lesson .nm{font-size:1.14rem; line-height:1.4; margin-top:1px}
.lesson .sub{font-size:.84rem; color:var(--ink-soft); line-height:1.5; margin-top:3px}
.lesson .best{font-size:.8rem; color:var(--ink-soft); margin-top:5px}
.l1{background:var(--blue-soft); border-color:var(--blue)} .l1 .no{color:var(--blue-deep)}
.l2{background:var(--yellow-soft); border-color:var(--yellow-deep)} .l2 .no{color:var(--ink-soft)}
.l3{background:var(--pink-soft); border-color:var(--pink-deep)} .l3 .no{color:var(--pink-deep)}
.foot{text-align:center; color:var(--ink-soft); font-size:.88rem; line-height:1.8}

/* ---------- quiz ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px}
.ghost{min-height:44px; padding:0 18px; border-radius:999px; border:2px solid var(--line); background:var(--card); cursor:pointer; font-size:.95rem}
.lesson-name{font-size:.95rem; color:var(--ink-soft); text-align:right}
.progress{display:flex; gap:6px}
.dot{flex:1 1 0; min-width:0; height:10px; border-radius:999px; border:2px solid var(--line); background:var(--card)}
.dot.cur{border-color:var(--blue); background:var(--blue-soft)}
.dot.ok{border-color:var(--yellow-deep); background:var(--yellow)}
.dot.bad{border-color:var(--pink-deep); background:var(--pink)}

.qcard{background:var(--card); border:2px solid var(--line); border-radius:28px; padding:20px; display:grid; align-content:start; gap:16px; box-shadow:var(--lift)}
.qhead{display:flex; align-items:center; justify-content:space-between; gap:10px}
.qnum{display:inline-block; padding:1px 16px; border-radius:999px; background:var(--yellow); color:var(--on-yellow); font-size:.95rem; letter-spacing:.08em}
.speak{width:46px; height:46px; border-radius:50%; border:2px solid var(--blue); background:var(--blue-soft); color:var(--blue-deep); display:grid; place-items:center; cursor:pointer}
.speak svg{width:22px; height:22px}
.qtext{font-size:1.28rem; line-height:1.75; text-wrap:pretty}
.art{display:flex; justify-content:center; padding:4px 0; min-width:0}
.art-svg{display:block; height:auto; max-width:100%}

.choices{display:grid; gap:12px}
.choice{
  display:flex; align-items:center; gap:14px; width:100%; min-height:62px; padding:10px 16px;
  font-size:1.1rem; text-align:left; cursor:pointer;
  border:2px solid var(--line); border-radius:20px; background:var(--card); box-shadow:0 3px 0 var(--line);
  transition:transform .08s;
}
.choice:hover:not(:disabled){border-color:var(--blue)}
.choice:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.zy{flex:none; width:36px; height:36px; border-radius:50%; background:var(--blue-soft); color:var(--blue-deep); display:grid; place-items:center; font-size:1rem}
.choice .tx{flex:1; min-width:0; font-family:var(--font-num); font-weight:500}
.choice .tx.cn{font-family:var(--font-body); font-weight:400}
.choice:disabled{cursor:default}
.choice:disabled:not(.correct):not(.wrong){opacity:.5}
.choice.correct{background:var(--yellow-soft); border-color:var(--yellow-deep); box-shadow:0 3px 0 var(--yellow-deep)}
.choice.correct .zy{background:var(--yellow); color:var(--on-yellow)}
.choice.correct::after{content:"✓"; font-size:1.4rem; color:var(--blue-deep)}
.choice.wrong{background:var(--pink-soft); border-color:var(--pink-deep); box-shadow:0 3px 0 var(--pink-deep)}
.choice.wrong .zy{background:var(--pink); color:var(--on-pink)}
.choice.wrong::after{content:"✗"; font-size:1.3rem; color:var(--pink-deep)}

.fill{display:grid; gap:12px; justify-items:center}
.fill-lab{color:var(--ink-soft); font-size:.9rem}
.fill-row{display:flex; align-items:center; gap:10px; font-size:1.2rem}
.fill input{
  width:6.2ch; padding:6px 10px; text-align:center; font:500 2rem var(--font-num);
  border:2px solid var(--blue); border-radius:18px; background:var(--card); color:var(--ink);
}
.fill input.correct{background:var(--yellow-soft); border-color:var(--yellow-deep)}
.fill input.wrong{background:var(--pink-soft); border-color:var(--pink-deep)}
.primary{
  min-height:54px; padding:0 30px; border:0; border-radius:999px; cursor:pointer;
  background:var(--btn); color:var(--on-btn); font-size:1.1rem; letter-spacing:.1em; box-shadow:0 4px 0 var(--btn-edge);
}
.primary:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--btn-edge)}
.primary:disabled{opacity:.4; cursor:default}

.feedback{display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 14px; align-items:center; padding:16px 18px; border-radius:24px; border:2px solid}
.feedback .fp{width:84px; height:84px; grid-row:span 2}
.feedback .fp svg{width:100%; height:100%; display:block}
.feedback.ok{background:var(--yellow-soft); border-color:var(--yellow-deep)}
.feedback.no{background:var(--pink-soft); border-color:var(--pink-deep)}
.feedback h3{font-size:1.2rem; line-height:1.4}
.feedback p{font-size:.98rem; line-height:1.75}
.feedback .primary{grid-column:1 / -1; justify-self:center; margin-top:6px}
.bounce{animation:bounce .7s ease-out 1}
.shake{animation:shake .5s ease-out 1}
@keyframes bounce{0%{transform:translateY(0)}35%{transform:translateY(-14px)}65%{transform:translateY(0)}82%{transform:translateY(-5px)}100%{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
.hero-pig{animation:bob 3.4s ease-in-out infinite}

/* ---------- art pieces ---------- */
.tiles{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.tile{min-width:60px; padding:4px 12px; text-align:center; font:500 1.6rem var(--font-num); letter-spacing:.04em; border-radius:16px; border:2px solid var(--blue); background:var(--blue-soft); color:var(--ink)}
.tile.hi{background:var(--pink-soft); border-color:var(--pink-deep)}
.tile.q{background:var(--yellow-soft); border-color:var(--yellow-deep); border-style:dashed}
.tile.big{font-size:1.8rem; min-width:76px}
.pv{display:grid; grid-template-columns:repeat(3, minmax(0,92px)); gap:10px; justify-content:center}
.pv div{border:2px solid var(--line); border-radius:18px; overflow:hidden; text-align:center; background:var(--card)}
.pv b{display:block; font:500 1.9rem var(--font-num); padding:2px 0}
.pv span{display:block; padding:1px 0; font-size:.85rem; color:var(--on-yellow); background:var(--yellow)}
.pv div:nth-child(1) span{background:var(--blue); color:var(--on-btn)}
.pv div:nth-child(2) span{background:var(--pink); color:var(--on-pink)}
.vert{display:grid; grid-template-columns:1.6rem 2rem 2rem; column-gap:6px; justify-content:center; align-items:center; font:500 2.3rem/1.25 var(--font-num); text-align:center}
.vert .vline{grid-column:1 / -1; height:0; border-top:3px solid var(--ink); margin-top:4px; border-radius:3px}
.vert .vop{color:var(--pink-deep)}
.eq{font:500 1.9rem/1.5 var(--font-num); text-align:center; letter-spacing:.06em; color:var(--ink)}
.eq .ci{display:inline-block; width:1.5em; height:1.5em; line-height:1.4em; border:2px dashed var(--yellow-deep); border-radius:50%; background:var(--yellow-soft); font-size:.9em; vertical-align:middle}
.bx{display:inline-block; width:1.4em; height:1.15em; border:2px dashed var(--yellow-deep); border-radius:8px; background:var(--yellow-soft); vertical-align:-.18em}
.digital{display:inline-block; padding:2px 18px; border-radius:16px; border:2px solid var(--blue); background:var(--blue-soft); font:500 2.1rem var(--font-num); letter-spacing:.08em; font-variant-numeric:tabular-nums}
.pairs{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center}
.art-center{text-align:center}

.f-ink{fill:#4f3647} .f-white{fill:#ffffff}
.blk{fill:var(--blue-soft); stroke:var(--blue); stroke-width:2}
.grid{stroke:var(--blue); stroke-width:1; fill:none; opacity:.55}
.cube{fill:var(--yellow); stroke:var(--yellow-deep); stroke-width:1.5}
.coin{fill:var(--yellow); stroke:var(--yellow-deep); stroke-width:2.5}
.coin5{fill:var(--blue); stroke:var(--blue-deep); stroke-width:2.5}
.coin1{fill:var(--pink); stroke:var(--pink-deep); stroke-width:2.5}
.coin-in{fill:none; stroke:rgba(61,49,0,.28); stroke-width:1.4}
.note{fill:var(--pink-soft); stroke:var(--pink-deep); stroke-width:2.5}
.note-c{fill:var(--pink); stroke:var(--pink-deep); stroke-width:1.8}
.svgtext{fill:var(--ink); font-family:var(--font-num); font-weight:500; text-anchor:middle}
.svgcn{fill:var(--ink); font-family:var(--font-body); font-weight:400; text-anchor:middle}
.coin-t{fill:#2b2300; font-family:var(--font-num); font-weight:500; text-anchor:middle}
.ruler{fill:var(--yellow-soft); stroke:var(--yellow-deep); stroke-width:2.5}
.tick{stroke:var(--ink); stroke-width:1.8; stroke-linecap:round}
.guide{stroke:var(--pink-deep); stroke-width:1.8; stroke-dasharray:4 4}
.seg-b{fill:var(--blue-soft); stroke:var(--blue); stroke-width:2.5}
.seg-p{fill:var(--pink-soft); stroke:var(--pink-deep); stroke-width:2.5}
.seg-y{fill:var(--yellow-soft); stroke:var(--yellow-deep); stroke-width:2.5}
.seg-cut{fill:none; stroke:var(--pink-deep); stroke-width:2.5; stroke-dasharray:6 5}
.plate{fill:var(--blue-soft); stroke:var(--blue); stroke-width:2.5}
.cookie{fill:var(--yellow); stroke:var(--yellow-deep); stroke-width:2}
.apple{fill:var(--pink); stroke:var(--pink-deep); stroke-width:2}
.ball{fill:var(--blue); stroke:var(--blue-deep); stroke-width:2}
.leaf{fill:var(--yellow-deep); stroke:none}
.gbox{fill:var(--blue-soft); stroke:var(--blue); stroke-width:2; stroke-dasharray:5 4}
.cup{fill:none; stroke:var(--blue-deep); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.water{fill:var(--blue); opacity:.55}
.waterfull{fill:var(--blue); opacity:.55}
.cell{stroke-width:2}
.cA{fill:var(--blue-soft); stroke:var(--blue)} .cB{fill:var(--pink-soft); stroke:var(--pink-deep)} .cC{fill:var(--yellow-soft); stroke:var(--yellow-deep)}
.lab-dot{stroke-width:2}
.face{fill:var(--card); stroke:var(--blue); stroke-width:4}
.ear{fill:var(--pink); stroke:var(--pink-deep); stroke-width:3}
.hand-h{stroke:var(--pink-deep); stroke-width:6; stroke-linecap:round}
.hand-m{stroke:var(--blue-deep); stroke-width:4; stroke-linecap:round}
.cdot{fill:var(--ink)}

/* ---------- result ---------- */
.res{background:var(--card); border:2px solid var(--line); border-radius:28px; padding:24px 20px; display:grid; gap:14px; justify-items:center; text-align:center; box-shadow:var(--lift)}
.res .rp{width:128px; height:128px}
.res .rp svg{width:100%; height:100%; display:block}
.res h2{font-size:1.45rem; line-height:1.5; text-wrap:balance}
.stars{display:flex; gap:8px}
.stars svg{width:50px; height:50px}
.star-on{fill:var(--yellow); stroke:var(--yellow-deep); stroke-width:3; stroke-linejoin:round}
.star-off{fill:none; stroke:var(--line); stroke-width:3; stroke-linejoin:round; stroke-dasharray:5 5}
.score{font:500 1.5rem var(--font-num); letter-spacing:.04em}
.review{width:100%; text-align:left; display:grid; gap:10px}
.review h3{font-size:1rem; color:var(--ink-soft)}
.rv{padding:10px 14px; border-radius:16px; background:var(--pink-soft); border:2px solid var(--pink-deep); font-size:.95rem; line-height:1.7}
.rv small{display:block; color:var(--ink-soft); font-size:.8rem}
.rv .ansn{font-family:var(--font-num); font-weight:500}
.actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
.secondary{min-height:54px; padding:0 24px; border-radius:999px; border:2px solid var(--blue); background:var(--card); color:var(--blue-deep); font-size:1.05rem; cursor:pointer}

@media (max-width:420px){
  body{font-size:16px}
  .hero{gap:12px} .hero-pig{width:84px; height:84px}
  .qcard{padding:16px}
  .qtext{font-size:1.18rem}
  .tile{min-width:52px; padding:4px 8px; font-size:1.4rem}
  .tile.big{min-width:66px; font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>

<div class="wrap">

  <section id="home" class="screen">
    <header class="hero">
      <div class="hero-pig" id="heroPig"></div>
      <div>
        <p class="eyebrow">翰林版 · 二年級上學期</p>
        <h1>二年級數學小測驗</h1>
        <p class="lede">選一個單元，每次從題庫隨機抽 10 題。答對就能集星星！</p>
      </div>
    </header>
    <div class="lessons" id="lessonList"></div>
    <p class="foot">每個單元有 100 題，每次玩都會抽到不同的題目。<br>題目旁邊的喇叭，可以把題目唸給你聽。</p>
  </section>

  <section id="quiz" class="screen" hidden>
    <div class="topbar">
      <button id="backBtn" class="ghost" type="button">← 回選單</button>
      <div class="lesson-name" id="qLesson"></div>
    </div>
    <div class="progress" id="progress"></div>
    <article class="qcard">
      <div class="qhead">
        <span class="qnum num" id="qNum"></span>
        <button id="speakBtn" class="speak" type="button" aria-label="把題目唸給我聽">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
      </div>
      <h2 class="qtext" id="qText"></h2>
      <div class="art" id="qArt"></div>
      <div id="qAnswer"></div>
    </article>
    <div id="feedback" class="feedback" hidden aria-live="polite"></div>
  </section>

  <section id="result" class="screen" hidden>
    <div class="res" id="resBox"></div>
  </section>

</div>

<script>
"use strict";

/* =====================================================================
   一、小工具
   ===================================================================== */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function R(r, a, b){ return a + Math.floor(r() * (b - a + 1)); }
function pick(r, arr){ return arr[Math.floor(r() * arr.length)]; }
function shuffle(r, arr){
  var a = arr.slice(), i, j, t;
  for(i = a.length - 1; i > 0; i--){ j = Math.floor(r() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function wrap12(x){ return ((x - 1) % 12 + 12) % 12 + 1; }
function twoOf(r, arr){
  var a = pick(r, arr), b = pick(r, arr), g = 0;
  while(b === a && g++ < 50) b = pick(r, arr);
  return [a, b];
}
var D = ["零","一","二","三","四","五","六","七","八","九"];
function cn(n){
  var h = Math.floor(n / 100), t = Math.floor(n % 100 / 10), o = n % 10, s = "";
  if(h) s += D[h] + "百";
  if(t){ s += D[t] + "十"; if(o) s += D[o]; }
  else if(o){ s += (h ? "零" : "") + D[o]; }
  return s;
}

/* 題目建構：MC 選項會打亂；MCF 選項順序固定；FILL 是填空 */
function MC(key, text, art, right, wrongs, exp, r){
  var seen = {}, opts = [String(right)], sh;
  seen[String(right)] = 1;
  wrongs.forEach(function(w){ w = String(w); if(!seen[w]){ seen[w] = 1; opts.push(w); } });
  opts = opts.slice(0, 3);
  sh = shuffle(r, opts);
  return { t:"mc", key:key, text:text, art:art || "", ch:sh, a:sh.indexOf(String(right)), exp:exp };
}
function MCF(key, text, art, choices, ai, exp){
  return { t:"mc", key:key, text:text, art:art || "", ch:choices.map(String), a:ai, exp:exp };
}
function FILL(key, text, art, ans, unit, exp){
  return { t:"fill", key:key, text:text, art:art || "", a:String(ans), unit:unit || "", exp:exp };
}

/* 故事用的角色與物品 */
var PIGN = ["小豬","粉粉","胖胖","呆呆","哼哼","團團","桃桃","波波"];
var OBJ = [["蘋果","顆"],["餅乾","塊"],["貼紙","張"],["彈珠","顆"],["氣球","個"],["糖果","顆"],["鉛筆","枝"],["小花","朵"],["貝殼","個"],["紙鶴","隻"]];
var EDIBLE = ["蘋果", "餅乾", "糖果"];

var S = 9;
function flat(x, y){
  var d = "", i;

  return '<rect x="' + x + '" y="' + y + '" width="' + (S*10) + '" height="' + (S*10) + '" rx="3" class="blk"/><path d="' + d + '" class="grid"/>';
}
function rod(x, y){
  var d = "", i;
  for(i = 1; i < 10; i++){ d += "M" + x + " " + (y + i*S) + "H" + (x + S); }

}
function cube(x, y){ return '<rect x="' + x + '" y="' + y + '" width="' + S + '" height="' + S + '" rx="2" class="cube"/>'; }
function wrapSvg(w, h, inner, maxw, label){

function blocksSvg(h, t, o){
  var x = 4, g = "", i;
  for(i = 0; i < h; i++){ g += flat(x, 6); x += S*10 + 10; }
  if(h) x += 6;
  for(i = 0; i < t; i++){ g += rod(x, 6); x += S + 4; }
  if(t) x += 10;
  for(i = 0; i < o; i++){ g += cube(x + (i % 3)*(S + 3), 6 + Math.floor(i/3)*(S + 3)); }
  var w = x + Math.min(o, 3)*(S + 3) + 4;

    x2 = 70 + Math.sin(a)*57; y2 = 74 - Math.cos(a)*57;

        '<button id="checkBtn" class="primary" type="submit" disabled>檢查答案</button></form>';
      inp = $("fillInput");
      inp.addEventListener("input", function(){ inp.value = inp.value.replace(/[^0-9]/g, ""); $("checkBtn").disabled = inp.value === ""; });
      $("fillForm").addEventListener("submit", function(ev){
        ev.preventDefault();
        if(cur.answered || inp.value === "") return;
        var ok = Number(inp.value) === Number(q.a);
        inp.className = ok ? "correct" : "wrong"; inp.disabled = true; $("checkBtn").disabled = true;
        finishQuestion(ok, q.a + (q.unit ? " " + q.unit : ""));
      });
      try { inp.focus({ preventScroll:true }); } catch(e){}
    }
  }

  function finishQuestion(ok, answerText){
    var q = cur.qs[cur.idx], last = cur.idx === 9, fb = $("feedback");
    cur.answered = true; cur.marks.push(ok); renderProgress();
    var praise = ["答對了！", "好棒喔！", "太厲害了！", "你好聰明！"][cur.idx % 4];
    fb.className = "feedback " + (ok ? "ok" : "no");
    fb.innerHTML =
      '<div class="fp ' + (reduce ? "" : (ok ? "bounce" : "shake")) + '">' + pig(ok ? "cheer" : "oops") + '</div>' +
      '<div><h3>' + (ok ? praise : "再看看喔，沒關係！") + '</h3>' +
      '<p>' + (ok ? "" : "正確答案是 <span class=\"num\">" + answerText + "</span>。") + q.exp + '</p></div>' +
      '<button type="button" class="primary" id="nextBtn">' + (last ? "看成績" : "下一題") + '</button>';
    fb.hidden = false;
    try { fb.scrollIntoView({ behavior:reduce ? "auto" : "smooth", block:"nearest" }); } catch(e){}
    $("nextBtn").addEventListener("click", function(){
      if(last){ renderResult(); } else { cur.idx++; renderQuestion(); try { window.scrollTo(0, 0); } catch(e){} }
    });
  }

  function renderResult(){
    var score = cur.marks.filter(function(m){ return m; }).length;
    saveBest(cur.unit.id, score);
    var n = score >= 9 ? 3 : (score >= 6 ? 2 : 1);
    var msg = score >= 9 ? "太厲害了！你是數學小達人！" : (score >= 6 ? "很棒喔！再練習一次會更好！" : "加油！多玩幾次就會進步！");
    var starPath = "M30 6l7.2 15.4 16.8 2-12.4 11.5 3.4 16.6L30 43l-15 8.5 3.4-16.6L6 23.4l16.8-2z";
    var stars = [1, 2, 3].map(function(i){ return '<svg viewBox="0 0 60 56" aria-hidden="true"><path d="' + starPath + '" class="' + (i <= n ? "star-on" : "star-off") + '"/></svg>'; }).join("");
    var wrong = [];
    cur.marks.forEach(function(m, i){
      if(!m){
        var q = cur.qs[i], ans = q.t === "mc" ? q.ch[q.a] : q.a + (q.unit ? " " + q.unit : "");
        wrong.push('<div class="rv"><small>第 ' + (i + 1) + ' 題</small>' + q.text + '<br>正確答案：<span class="ansn">' + ans + '</span></div>');
      }
    });
    var next = UNITS.filter(function(U){ return U.id === cur.unit.id + 1; })[0];
    $("resBox").innerHTML =
      '<div class="rp ' + (reduce ? "" : "bounce") + '">' + pig(score >= 6 ? "cheer" : "happy") + '</div>' +
      '<h2>' + msg + '</h2>' +
      '<div class="stars" role="img" aria-label="得到 ' + n + ' 顆星">' + stars + '</div>' +
      '<p class="score">答對 ' + score + ' / 10 題</p>' +
      (wrong.length ? '<div class="review"><h3>這幾題再看一次</h3>' + wrong.join("") + '</div>' : '<p>10 題全部答對，沒有要複習的題目！</p>') +
      '<div class="actions"><button type="button" class="primary" id="againBtn">再抽 10 題</button>' +
      (next ? '<button type="button" class="secondary" id="nextUnitBtn">下一個單元</button>' : '') +
      '<button type="button" class="secondary" id="homeBtn">回選單</button></div>';
    show("result");
    $("againBtn").addEventListener("click", function(){ startUnit(cur.unit.id); });
    if(next){ $("nextUnitBtn").addEventListener("click", function(){ startUnit(next.id); }); }
    $("homeBtn").addEventListener("click", goHome);
  }

  function goHome(){ renderHome(); show("home"); }

  $("lessonList").addEventListener("click", function(ev){
    var b = ev.target.closest("[data-unit]");
    if(b) startUnit(Number(b.getAttribute("data-unit")));
  });
  $("backBtn").addEventListener("click", goHome);
  $("qAnswer").addEventListener("click", function(ev){
    var b = ev.target.closest(".choice");
    if(!b || cur.answered) return;
    var q = cur.qs[cur.idx], i = Number(b.getAttribute("data-i")), ok = i === q.a;
    $("qAnswer").querySelectorAll(".choice").forEach(function(el, k){
      el.disabled = true;
      if(k === q.a) el.classList.add("correct"); else if(k === i) el.classList.add("wrong");
    });
    finishQuestion(ok, q.ch[q.a]);
  });

  var canSpeak = false;
  try { canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined"; } catch(e){}
  if(!canSpeak){ $("speakBtn").hidden = true; }
  $("speakBtn").addEventListener("click", function(){
    try {
      var u = new SpeechSynthesisUtterance(cur.qs[cur.idx].text.replace(/[×]/g, "乘").replace(/[−]/g, "減").replace(/[+]/g, "加"));
      window.speechSynthesis.cancel(); u.lang = "zh-TW"; u.rate = 0.85; window.speechSynthesis.speak(u);
    } catch(e){}
  });

  renderHome();
})();
</script>
</body>
</html>
